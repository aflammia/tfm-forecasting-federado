#cloud-config
# cloud-init.yaml — se ejecuta en cada VM al primer arranque (az vm create --custom-data).
# Instala solo lo básico del SO + Python; las dependencias de Python (torch CPU, flwr, ...) las
# instala infra/03_deploy.sh DESPUÉS de subir el código (para no duplicar la lista de deps: la
# fuente única es flower_app/requirements.txt). Mantener esto mínimo acelera el arranque.
package_update: true
packages:
  - python3-pip
  - python3-venv
  - git
runcmd:
  # Crear el venv una vez, para que 03_deploy.sh solo tenga que hacer pip install dentro.
  - python3 -m venv /home/azureuser/venv
  - chown -R azureuser:azureuser /home/azureuser/venv
  - echo 'source /home/azureuser/venv/bin/activate' >> /home/azureuser/.bashrc
