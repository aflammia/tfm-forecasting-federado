[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tfm-fl"
version = "1.0.0"
description = "Simulacro federado real (Deployment Engine) del TFM: 3 silos, FedAvg/FedProx, dashboard en Azure ML"
license = "MIT"
dependencies = [
    "flwr[simulation]>=1.32.0",
    "torch",
    "pandas",
    "pyarrow",
    "numpy",
    # mlflow + azureml-mlflow solo hacen falta en el coordinador de Azure (dashboard). No se
    # incluyen aquí como dependencia dura para no cargarlas en la simulación local del paso 2;
    # cloud-init las instala en la VM del coordinador (ver infra/cloud-init-coordinador.yaml).
]

[tool.hatch.build.targets.wheel]
packages = ["tfm_fl"]

[tool.flwr.app]
publisher = "aflammia"

[tool.flwr.app.components]
serverapp = "tfm_fl.server_app:app"
clientapp = "tfm_fl.client_app:app"

[tool.flwr.app.config]
# Hiperparámetros de la corrida (overridables en `flwr run` con --run-config "clave=valor").
# Valores por defecto = arquitectura ganadora del tuning (Sesión 28) + config de la Condición D.
num-server-rounds = 15
local-epochs = 2
lr = 0.002
estrategia = "fedavg"
proximal-mu = 0.01
# URI de tracking de MLflow -> Azure ML (dashboard). Se pasa por `flwr run --run-config` (05_run.sh)
# porque el superexec de Flower no propaga las env vars al ServerApp. Vacio = sin dashboard.
mlflow-tracking-uri = ""

# IMPORTANTE (flwr 1.32.1): la config de CONEXION a SuperLinks NO va aqui. Esta version migra
# cualquier bloque [tool.flwr.federations] a ~/.flwr/config.toml, y si hubiera un placeholder
# (p.ej. COORDINADOR_IP) lo resucitaria SOBRESCRIBIENDO la IP real que escribe infra/05_run.sh.
# Por eso NO hay bloque de federaciones aqui: 05_run.sh escribe ~/.flwr/config.toml con la IP real
# del agregador. La verificacion de equivalencia LOCAL (paso 2) no usa `flwr run`: corre los app
# objects con run_simulation() (infra/verificar_equivalencia_local.py).
